name: appliances-chilled

on:
  schedule:
    - cron: "0 */6 * * *"   # fridge + hood, every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecourt-appliances
  cancel-in-progress: false

jobs:
  chilled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Poll fridge + hood
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python appliances.py --group chilled
      - name: Commit state
        run: |
          git config user.name "forecourt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/appliance_state.json docs/appliances.json || true
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "Appliances (chilled) $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi
